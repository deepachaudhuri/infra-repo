name: Terraform Deploy

on:
  pull_request:
    branches:
      - dev
      - stage
      - prod
  push:
    branches:
      - dev
      - stage
      - prod

jobs:
  terraform:
    name: Terraform Plan and Apply
    runs-on: ubuntu-latest

    environment: #${{ github.base_ref }}
      name: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Terraform init
        working-directory: ./
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=infra-repo/${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}.tfstate" \
            -backend-config="region=us-east-1"

      - name: Terraform validate
        working-directory: ./
        run: terraform validate

      - name: Terraform plan
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        working-directory: ./
        run: terraform plan -input=false -out=tfplan

    #   - name: Terraform apply
    #     if: github.event_name == 'push' && (startsWith(github.base_ref, 'refs/heads/dev') || startsWith(github.base_ref, 'refs/heads/stage') || startsWith(github.base_ref, 'refs/heads/prod'))
    #     working-directory: ./
    #     run: terraform apply -input=false tfplan

      - name: Terraform apply
        if: github.event_name == 'push'
        run: terraform apply -input=false tfplan
